---
# ColQwen2.5 embedding service.
# All configuration is read from the .env file next to this compose file -
# edit .env, then: docker compose build && docker compose up -d
services:
  colqwen:
    build:
      context: .
      args:
        NGC_PYTORCH_TAG: "${NGC_PYTORCH_TAG}"
        COLPALI_VERSION: "${COLPALI_VERSION}"
    container_name: colqwen
    restart: unless-stopped
    # NGC PyTorch images recommend host IPC plus raised memlock/stack limits
    # (docker run --ipc=host --ulimit memlock=-1 --ulimit stack=67108864).
    # Not strictly needed for this single-process inference service, but it
    # silences the SHMEM startup NOTE and avoids the 64MB /dev/shm cap if
    # multi-process code (e.g. DataLoader workers) is ever added.
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - COLQWEN_MODEL=${COLQWEN_MODEL}
      - HF_HOME=${COLQWEN_MODEL_DIR}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    # The model dir is mounted at the IDENTICAL path so absolute
    # base_model_name_or_path entries in adapter_config.json resolve.
    volumes:
      - "${COLQWEN_MODEL_DIR}:${COLQWEN_MODEL_DIR}:ro"
    ports:
      - "${COLQWEN_PORT}:8000"
    # GPU via CDI — deliberately NOT `deploy.resources.reservations.devices`.
    # The legacy path injects /dev/nvidia* from an OCI prestart hook, i.e.
    # AFTER runc has created the container's systemd scope, so systemd never
    # learns about those nodes. Any later `systemctl daemon-reload` (snapd
    # triggers one every few hours) rewrites the scope's cgroup-v2 eBPF device
    # filter from its own DeviceAllow list and silently revokes GPU access
    # from the RUNNING container: open("/dev/nvidiactl") starts returning
    # EPERM, the first cuBLAS GEMM fails with CUBLAS_STATUS_INTERNAL_ERROR,
    # and the CUDA context stays poisoned for the life of the process. The
    # container keeps serving /health with 200 the whole time.
    # CDI injects the devices into the OCI spec BEFORE the container is
    # created, so runc records them in the scope's DeviceAllow and a reload
    # re-applies them instead of dropping them.
    #
    # Requires a CDI spec on the host — regenerate after every driver update:
    #   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    devices:
      - "nvidia.com/gpu=all"
