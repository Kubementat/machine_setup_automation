// Regenerate the NVIDIA CDI spec after every dpkg transaction that replaced
// the driver libraries.
//
// Rendered from templates/nvidia-container/apt-hook.conf by
// tasks/setup-nvidia-container.sh. Do not edit in place — re-run the task.
//
// The refresh helper is cheap on the common path: it stats the /usr paths the
// spec references and exits without writing when they all resolve, so the
// overhead on an unrelated `apt install` is a few dozen stat() calls.
//
// `|| true` is deliberate: a failing Post-Invoke aborts apt with an error, and
// a CDI spec that could not be regenerated must never wedge package
// management. The helper prints its own loud ERROR line in that case.
DPkg::Post-Invoke { "if [ -x ${NVIDIA_CDI_REFRESH_BIN} ]; then NVIDIA_CDI_SPEC=${NVIDIA_CDI_SPEC} ${NVIDIA_CDI_REFRESH_BIN} --quiet || true; fi"; };
