# vLLM-Omni Docker Compose
# Generated: ${GENERATED_DATE}
# Backend: ${BACKEND_UPPER} | Arch: ${ARCH} | Image: ${VLLM_OMNI_IMAGE}

networks:
  vllm-omni:
    external: false

services:
  vllm-omni:
    image: ${VLLM_OMNI_IMAGE}
    container_name: vllm-omni
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_NO_USAGE_STATS=1
    volumes:
      - ${HF_CACHE_DIR}:/root/.cache/huggingface
    shm_size: '${VLLM_OMNI_SHM_SIZE}'
    ipc: "host"
    ports:
      - "${VLLM_OMNI_PORT}:8000"
    # GPU via CDI — deliberately NOT deploy.resources.reservations.devices.
    # The legacy path injects /dev/nvidia* from an OCI prestart hook, after
    # runc created the container's systemd scope, so a later
    # `systemctl daemon-reload` rebuilds the scope's device filter and revokes
    # GPU access from the RUNNING container (CUDA fails, /health stays 200).
    # CDI puts the devices in the OCI spec before creation, so a reload
    # re-applies them. Spec upkeep: tasks/setup-nvidia-container.sh.
    devices:
      - "nvidia.com/gpu=all"
    networks:
      - vllm-omni
    command: >
      vllm serve ${VLLM_OMNI_MODEL}
      --omni
      --host 0.0.0.0
      --port 8000
      ${VLLM_OMNI_COMMAND_FLAGS}
