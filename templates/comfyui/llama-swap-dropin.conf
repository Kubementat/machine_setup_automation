# Managed by tasks/setup-comfyui.sh — re-run the task instead of editing this.
#
# With COMFYUI_SUPERVISOR=llama-swap, ComfyUI runs as a child of llama-swap,
# so PyTorch's recommended limits (unlimited locked memory for pinned host
# buffers, 64 MiB stack) have to be set on this unit. They apply to every
# llama-swap backend. The effect on GB10 is unmeasured.
[Service]
LimitMEMLOCK=infinity
LimitSTACK=67108864
